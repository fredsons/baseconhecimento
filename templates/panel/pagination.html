<nav aria-label="Paginação"><span>Página {{ pagination.number }} de {{ pagination.paginator.num_pages }}</span>{% if pagination.has_previous %}<a href="?q={{ q|urlencode }}&status={{ status }}&page={{ pagination.previous_page_number }}">← Anterior</a>{% endif %}{% if pagination.has_next %}<a href="?q={{ q|urlencode }}&status={{ status }}&page={{ pagination.next_page_number }}">Próxima →</a>{% endif %}</nav>
