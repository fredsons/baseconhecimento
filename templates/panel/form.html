{% extends 'panel/base.html' %}{% block panel_content %}<a href="{% url back %}">← Voltar</a><h2 class="mt-4">{{ title }}</h2><form class="editor" method="post" data-dirty {% if confirm_deactivate %}data-confirm-deactivate="true" data-confirm-subject="{{ form.instance.username }}"{% endif %}>{% csrf_token %}{% if form.errors %}<div class="app-alert" role="alert"><strong>Revise os campos indicados</strong><p>O formulário não foi salvo. Corrija os erros abaixo e tente novamente.</p></div>{% endif %}{{ form.as_p }}<button class="btn btn-primary">Salvar</button></form>{% endblock %}
