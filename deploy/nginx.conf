server {
    listen 80;
    server_name conhecimento.empresa.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name conhecimento.empresa.com;
    ssl_certificate /etc/letsencrypt/live/conhecimento.empresa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/conhecimento.empresa.com/privkey.pem;
    client_max_body_size 52m;
    location /static/ { alias /opt/acervo/staticfiles/; }
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 120;
    }
}
